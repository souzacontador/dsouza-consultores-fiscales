<head>
<meta charset="utf-8">

<title>Calculadora de ISR · Asimilados a salarios 2026 · DSouza Consultores Fiscales</title>
<meta name="description" content="Calcula la retención de ISR sobre percepciones asimiladas a salarios (honorarios asimilados, consejeros, cooperativas y más) conforme al Anexo 8 de la RMF 2026. Cálculo directo, inverso y proyección anual.">
<meta name="author" content="C.P. Daniel Souza Vázquez — DSouza Consultores Fiscales">
<style>/* Calculadora ISR Asimilados 2026 — estilos.
 * Design System DSouza: marino #003366 (jerarquía), cian #00B8D9 (acento tecnológico),
 * gris medio #999999 (secundario/decorativo), blanco #FFFFFF (lectura). Títulos Georgia
 * (serif), cuerpo Arial/Calibri. Ver DESIGN_SYSTEM_CALCULADORA.md. */
:root {
  --navy: #003366; /* marino: barras, jerarquía, totales */
  --navy2: #004a99; /* marino claro: degradado del encabezado */
  --accent: #00b8d9; /* cian: acentos tecnológicos */
  --accent-dark: #0086a8; /* cian oscuro: hover/enlaces (AA sobre blanco) */
  --ink: #1a1a1a; /* texto principal */
  --gray-med: #999999; /* gris medio de marca: bordes de énfasis, texto decorativo grande */
  --muted: #6b7280; /* secundario legible (AA en tamaño normal); hue del gris de marca oscurecido */
  --muted2: #9aa3af; /* terciario/placeholder */
  --line: #e2e8f0;
  --line2: #f3f5f8;
  --bg: #f4f6f9;
  --card: #ffffff;
  --ok: #0f766e;
  --ok-bg: #ecfdf5;
  --ok-line: #a7f3d0;
  --rose: #e11d48;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --amber-line: #fcd34d;
  --radius: 16px;
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }

#app {
  /* Cuerpo: Calibri/Arial para máxima legibilidad. */
  font-family: Calibri, Arial, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 16px;
  min-height: 100vh;
}

/* Títulos principales: serifa Georgia (respaldo Times New Roman), según la marca.
 * Solo el título principal del encabezado; los encabezados de sección van en sans. */
.hero h1, .serif { font-family: Georgia, 'Times New Roman', 'Times', serif; }

/* Encabezado */
.hero {
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: #fff;
  padding: 32px 20px 40px;
}
.hero .wrap { max-width: 960px; margin: 0 auto; }
.hero .brand {
  font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  opacity: 0.85; font-weight: 700; margin-bottom: 10px;
}
.hero h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 700; margin-bottom: 8px; }
.hero p { opacity: 0.85; font-size: 15px; max-width: 560px; }
.hero .fuente {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18);
  padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.hero .fuente .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Layout */
main { max-width: 960px; margin: -24px auto 0; padding: 0 20px 48px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 860px) { .grid { grid-template-columns: 360px 1fr; align-items: start; } }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--shadow);
}
.card h2 {
  font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line2);
  display: flex; align-items: center; gap: 8px;
}

/* Controles */
.campo { margin-bottom: 18px; }
.campo > label.tit {
  display: block; font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px;
}
.segmento { display: flex; background: var(--line2); padding: 4px; border-radius: 12px; gap: 4px; }
.segmento button {
  flex: 1; border: 0; background: transparent; cursor: pointer;
  padding: 10px 8px; font-size: 13px; font-weight: 700; border-radius: 9px;
  color: var(--muted); transition: all 0.15s; font-family: inherit;
}
.segmento button[aria-pressed='true'] { background: #fff; color: var(--navy); box-shadow: var(--shadow); }
.segmento button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

select, input[type='text'] {
  width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
  background: var(--line2); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; transition: border-color 0.15s;
}
select { cursor: pointer; font-weight: 600; }
select:focus, input[type='text']:focus { outline: none; border-color: var(--accent); }

.periodos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.periodos button {
  border: 1px solid var(--line); background: #fff; cursor: pointer;
  padding: 10px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase;
  border-radius: 10px; color: var(--muted); transition: all 0.15s; font-family: inherit;
}
.periodos button[aria-pressed='true'] { background: var(--navy); border-color: var(--navy); color: #fff; }
.periodos button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.monto-wrap { position: relative; }
.monto-wrap .signo {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-weight: 700; font-size: 18px; pointer-events: none;
}
.monto-wrap input {
  padding-left: 30px; font-size: 22px; font-weight: 700;
  border-radius: 14px; padding-top: 14px; padding-bottom: 14px;
}
.error {
  color: var(--rose); font-size: 13px; margin-top: 8px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}

.check {
  display: flex; align-items: flex-start; gap: 10px; margin-top: 8px;
  padding: 12px; background: var(--line2); border-radius: 10px;
}
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
.check label { font-size: 13px; color: var(--muted); cursor: pointer; }
.check label b { color: var(--ink); }

.acciones { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.acciones button {
  flex: 1; min-width: 120px; border: 1px solid var(--line); background: #fff;
  cursor: pointer; padding: 11px; font-size: 13px; font-weight: 700;
  border-radius: 10px; color: var(--navy); transition: all 0.15s; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.acciones button:hover { border-color: var(--accent); color: var(--accent-dark); }
.acciones button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copiado { color: var(--accent-dark); }

/* Resultado — tarjeta principal en lenguaje institucional (marino sobre blanco, acento cian) */
.resultado { display: flex; flex-direction: column; gap: 20px; }
.neto-card {
  background: linear-gradient(135deg, #ffffff, #f0f7fb);
  border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 20px;
  padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between;
  align-items: center; gap: 16px; box-shadow: var(--shadow);
}
.neto-card .etq { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-dark); margin-bottom: 6px; }
.neto-card .valor { font-size: clamp(32px, 8vw, 52px); font-weight: 800; color: var(--navy); letter-spacing: -1px; }
.neto-card .tasa {
  background: var(--navy); border: 1px solid var(--navy);
  border-radius: 14px; padding: 12px 18px; text-align: center;
}
.neto-card .tasa .etq { color: rgba(255, 255, 255, 0.75); }
.neto-card .tasa .n { font-size: 22px; font-weight: 800; color: #fff; }

.aviso {
  border-radius: 12px; padding: 14px 16px; font-size: 13px; font-weight: 600;
  display: flex; gap: 10px; align-items: flex-start;
}
.aviso.cercano { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); }
.aviso.excede { background: #fef2f2; border: 1px solid #fecaca; color: var(--rose); }
.aviso .ico { flex-shrink: 0; }

.dos-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 560px) { .dos-col { grid-template-columns: 1fr 1fr; } }

.mov .fila, .desglose .fila {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 0; border-bottom: 1px solid var(--line2); font-size: 14px;
}
.mov .fila:last-child, .desglose .fila:last-child { border-bottom: 0; }
.mov .fila .k { color: var(--muted); font-weight: 600; }
.mov .fila .v { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.mov .fila.resta .k, .mov .fila.resta .v { color: var(--rose); }
.mov .fila.total { padding-top: 14px; margin-top: 4px; border-top: 2px solid var(--line); border-bottom: 0; }
.mov .fila.total .k { color: var(--navy); font-weight: 800; text-transform: uppercase; font-size: 13px; }
.mov .fila.total .v { color: var(--navy); font-size: 20px; font-weight: 800; }

.desglose .fila .op { color: var(--muted2); font-weight: 700; margin-right: 6px; }
.desglose .fila .k small { display: block; color: var(--muted2); font-weight: 500; font-size: 11px; }
.badge-tasa { background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.min35 { background: var(--line2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 13px; color: var(--ink); font-style: italic; }

.claves h2 { color: #fff; border-color: rgba(255,255,255,0.15); }
.claves { background: var(--navy); border-color: var(--navy); }
.claves .grid4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 460px) { .claves .grid4 { grid-template-columns: repeat(4, 1fr); } }
.claves .clave { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; }
.claves .clave .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.claves .clave .v { font-size: 16px; font-weight: 800; color: #fff; font-family: 'Courier New', monospace; }

.proy .fila { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--line2); }
.proy .fila .k { color: var(--muted); font-weight: 600; }
.proy .fila .v { font-weight: 700; font-variant-numeric: tabular-nums; }

.vacio { text-align: center; padding: 48px 24px; color: var(--muted); }
.vacio .ico { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
.vacio h3 { font-size: 17px; color: var(--ink); margin-bottom: 6px; }

.nota-legal {
  margin-top: 20px; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; padding: 18px; font-size: 12px; color: var(--muted); line-height: 1.6;
}
.nota-legal b { color: var(--ink); }
.nota-legal .leyenda {
  margin-top: 12px; padding: 12px 14px; background: #f0f7fb;
  border-left: 4px solid var(--accent); border-radius: 8px;
  color: var(--ink); font-weight: 600; font-style: italic;
}
.pie {
  max-width: 960px; margin: 24px auto 0; padding: 22px 20px;
  text-align: center; border-top: 3px solid var(--navy);
}
.pie .atrib { color: var(--ink); font-size: 14px; font-weight: 600; }
.pie .atrib strong { color: var(--navy); font-weight: 800; }
.pie .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.pie a { color: var(--accent-dark); text-decoration: none; font-weight: 700; }
.pie a:hover { text-decoration: underline; }

/* Impresión: papel de trabajo */
@media print {
  #app { background: #fff; font-size: 12px; }
  .hero { background: #fff; color: var(--ink); border-bottom: 2px solid var(--navy); padding: 0 0 12px; }
  .hero .fuente { background: none; border: 0; padding: 0; }
  .config, .acciones, .segmento, .no-print { display: none !important; }
  main { grid-template-columns: 1fr; margin: 12px 0 0; padding: 0; max-width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .card, .neto-card, .claves { box-shadow: none; border: 1px solid var(--line); break-inside: avoid; }
  .claves { background: #fff; }
  .claves h2, .claves .clave .v { color: var(--ink); }
  .neto-card { background: #fff; }
  .neto-card .valor { color: var(--ink); }
}</style>

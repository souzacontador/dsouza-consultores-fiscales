document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b1674fba-5b43-4cbd-b379-f4f0a5ff365e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e96a157a-e4fa-4164-8f57-712874303d58\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"61f4b31a-ce34-4d99-a543-a4d34f3f6308\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cdf8e24e-a239-484b-9099-e2443e3d6f56\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a08adf52-e011-462d-826d-243f3db9839b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"150a1347-3e67-4ea0-b1e6-e14258d15c95\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b1674fba-5b43-4cbd-b379-f4f0a5ff365e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<title>Calculadora de IVA y Retenciones 2026 · DSouza Consultores Fiscales<\u002Ftitle>\n<style>\n  /* =====================================================================\n     PALETA OFICIAL DSouza Consultores — Refinada 2026 (tokens de marca)\n     Azul Meridiano #0A2540 · Cian Algorítmico #00B8D9 (texto: 700 #00768C)\n     Canvas cálido #F7F6F4 · Tinta 900/700/500 · Semánticos verificados AA\n     ===================================================================== */\n  :root{\n    --azul-900:#061726; --azul-800:#0A2540; --azul-700:#123253; --azul-600:#1B4A78;\n    --azul-500:#26639D; --azul-100:#D6E2EE; --azul-50:#EFF4F9;\n    --cian-500:#00B8D9; --cian-700:#00768C; --cian-100:#D0F1F8; --cian-50:#ECFAFD;\n    --canvas:#F7F6F4; --superficie:#FFFFFF; --superficie-alt:#FCFBFA;\n    --hairline:#E3E1DE; --hairline-fuerte:#CFCCC7;\n    --tinta-900:#14181D; --tinta-700:#2B3138; --tinta-500:#545C68;\n    --inv:#FFFFFF; --inv-suave:#C9D6E4;\n    /* Semáforo semántico (texto/fondo/borde verificados AA) */\n    --alto-txt:#A81D14;  --alto-bg:#FCEAE8;  --alto-bd:#F0BDB8;\n    --medio-txt:#8A5A00; --medio-bg:#FDF3E0; --medio-bd:#F3DCAF;\n    --bajo-txt:#1B5E45;  --bajo-bg:#E7F4EE;  --bajo-bd:#B9DFCC;\n    --info-txt:#123253;  --info-bg:#EFF4F9;  --info-bd:#D6E2EE;\n    --radio:14px;\n    --sombra:0 4px 14px rgba(10,37,64,.08);\n    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;\n    --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;\n    --mono:'IBM Plex Mono',Consolas,monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html{font-size:18px} /* base de marca: 18px; nada por debajo de 16px */\n  body{font-family:var(--sans);background:var(--canvas);color:var(--tinta-700);line-height:1.55;min-height:100vh}\n\n  /* ============ Masthead institucional (degradado 800→600, único permitido) ============ */\n  header{\n    background:linear-gradient(135deg,var(--azul-800) 0%,var(--azul-600) 100%);\n    color:var(--inv);padding:1.7rem 1rem 1.5rem;text-align:center;\n  }\n  header .despacho{\n    font-family:var(--mono);font-size:.89rem;letter-spacing:.14em;text-transform:uppercase;\n    color:var(--inv-suave);\n  }\n  header h1{font-family:var(--serif);font-size:clamp(1.35rem,3.5vw,2rem);font-weight:700;margin-top:.3rem}\n  header p{font-size:clamp(.89rem,2.5vw,1rem);color:var(--inv-suave);margin-top:.35rem}\n  main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 3rem}\n  .tarjeta{\n    background:var(--superficie);border:1px solid var(--hairline);border-radius:var(--radio);\n    box-shadow:var(--sombra);padding:1.2rem;margin-top:1.2rem;\n  }\n  .paso{\n    display:inline-block;background:var(--azul-800);color:var(--inv);border-radius:999px;\n    font-size:.89rem;font-weight:700;padding:.2rem .8rem;margin-bottom:.6rem;letter-spacing:.5px;\n  }\n  /* ============ Botones segmentados ============ */\n  .segmentos{display:flex;flex-wrap:wrap;gap:.5rem}\n  .segmentos button{\n    flex:1 1 130px;border:2px solid var(--hairline-fuerte);background:var(--superficie);\n    color:var(--tinta-700);padding:.7rem .6rem;border-radius:10px;font-size:.95rem;font-weight:600;\n    font-family:var(--sans);cursor:pointer;transition:all .15s ease;min-height:48px;\n  }\n  .segmentos button:hover{border-color:var(--cian-700)}\n  .segmentos button:focus-visible{outline:3px solid var(--cian-500);outline-offset:2px}\n  .segmentos button.activo{background:var(--azul-800);border-color:var(--azul-800);color:var(--inv)}\n  .segmentos button small{display:block;font-weight:400;font-size:.89rem;opacity:.85}\n  /* ============ Selects y campos ============ */\n  select,input[type=text]{\n    width:100%;padding:.75rem .8rem;font-size:1rem;font-family:var(--sans);\n    border:2px solid var(--hairline-fuerte);border-radius:10px;background:var(--superficie);color:var(--tinta-900);\n  }\n  select:focus,input:focus{outline:none;border-color:var(--cian-700)}\n  label.etiqueta{display:block;font-weight:600;margin-bottom:.4rem;font-size:.92rem;color:var(--tinta-900)}\n  .nota{\n    margin-top:.6rem;font-size:.89rem;background:var(--info-bg);color:var(--info-txt);\n    border:1px solid var(--info-bd);border-left:4px solid var(--azul-600);\n    padding:.55rem .8rem;border-radius:6px;\n  }\n  .campo-monto{position:relative}\n  .campo-monto .simbolo{\n    position:absolute;left:.85rem;top:50%;transform:translateY(-50%);\n    font-weight:700;color:var(--azul-800);font-size:1.1rem;\n  }\n  .campo-monto input{padding-left:2rem;font-size:1.3rem;font-weight:600;font-family:var(--mono)}\n  /* ============ Resultados ============ */\n  #resultados h2{\n    font-family:var(--serif);font-size:1.25rem;color:var(--azul-800);\n    margin-bottom:.6rem;padding-bottom:.45rem;border-bottom:3px solid var(--cian-500);\n  }\n  /* Chips de contexto de la selección */\n  .chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.5rem 0 1rem}\n  .chip{\n    background:var(--azul-50);border:1px solid var(--azul-100);color:var(--azul-700);\n    border-radius:999px;padding:.28rem .75rem;font-size:.89rem;font-weight:600;line-height:1.3;\n  }\n  .chip span{\n    display:block;font-size:.89rem;font-weight:700;letter-spacing:.08em;\n    text-transform:uppercase;color:var(--tinta-500);\n  }\n  /* Marco de la tabla */\n  .tabla-marco{border:1px solid var(--hairline);border-radius:12px;overflow-x:auto;box-shadow:var(--sombra)}\n  table.desglose{width:100%;border-collapse:collapse;font-size:.98rem}\n  table.desglose thead th{\n    background:var(--azul-800);color:var(--inv);text-align:left;\n    font-size:.89rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n    padding:.7rem .85rem;border-bottom:none;\n  }\n  table.desglose td{padding:.72rem .85rem;border-bottom:1px solid var(--hairline);text-align:left;vertical-align:middle}\n  table.desglose tbody tr:nth-child(even):not(.total) td{background:var(--superficie-alt)}\n  table.desglose td.monto{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--mono);white-space:nowrap}\n  table.desglose td.pct{text-align:right;font-size:.89rem;color:var(--tinta-500);font-family:var(--mono);white-space:nowrap}\n  /* Insignias de signo */\n  .signo{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:1.4rem;height:1.4rem;border-radius:50%;font-weight:700;font-size:.82rem;\n    margin-right:.55rem;flex:none;\n  }\n  .signo.base{background:var(--azul-50);color:var(--azul-700);border:1px solid var(--azul-100)}\n  .signo.mas{background:var(--bajo-bg);color:var(--bajo-txt);border:1px solid var(--bajo-bd)}\n  .signo.menos{background:var(--alto-bg);color:var(--alto-txt);border:1px solid var(--alto-bd)}\n  tr.suma td.monto{color:var(--bajo-txt)}\n  tr.resta td.monto{color:var(--alto-txt)}\n  /* Banda de total */\n  tr.total td{\n    background:var(--azul-800);color:var(--inv);border-bottom:none;\n    font-size:1.1rem;font-weight:800;padding:.9rem .85rem;\n  }\n  tr.total td.monto{font-size:1.28rem;color:var(--inv)}\n  tr.total td.pct{color:var(--inv-suave)}\n  .factor-caja{\n    margin-top:1rem;background:var(--superficie-alt);border:1px solid var(--hairline);\n    border-radius:10px;padding:.75rem .9rem;font-size:.89rem;\n  }\n  .factor-caja code{\n    font-family:var(--mono);font-size:.95rem;background:var(--cian-50);color:var(--azul-700);\n    padding:.1rem .4rem;border-radius:5px;border:1px solid var(--cian-100);\n  }\n  .fundamento-caja{\n    margin-top:.8rem;background:var(--bajo-bg);color:var(--bajo-txt);border:1px solid var(--bajo-bd);\n    border-radius:10px;padding:.75rem .9rem;font-size:.89rem;\n  }\n  .advertencia{\n    margin-top:.8rem;font-size:.89rem;background:var(--medio-bg);color:var(--medio-txt);\n    border:1px solid var(--medio-bd);border-left:4px solid var(--medio-txt);\n    padding:.55rem .8rem;border-radius:6px;\n  }\n  .advertencia strong{text-transform:uppercase;letter-spacing:.05em;font-size:.89rem}\n  .fuera-alcance{\n    margin-top:.6rem;font-size:.92rem;background:var(--alto-bg);color:var(--alto-txt);\n    border:1px solid var(--alto-bd);border-left:4px solid var(--alto-txt);\n    padding:.7rem .9rem;border-radius:6px;\n  }\n  .oculto{display:none}\n  .estado-vacio{margin-top:1.2rem;text-align:center;font-size:.95rem;color:var(--tinta-500);background:var(--superficie-alt);border:1px dashed var(--hairline-fuerte);border-radius:var(--radio);padding:1.1rem 1rem}\n  input.invalido{border-color:var(--alto-txt)}\n  .error-monto{margin-top:.45rem;font-size:.89rem;color:var(--alto-txt)}\n  .sr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n  /* ============ Botones de exportación (acción = cian, único color de acción) ============ */\n  .zona-export{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}\n  .btn-export{\n    flex:1 1 180px;border:none;border-radius:10px;padding:.8rem 1rem;min-height:48px;\n    background:var(--cian-700);color:var(--inv);font-family:var(--sans);\n    font-size:.95rem;font-weight:700;cursor:pointer;transition:background .15s ease;\n  }\n  .btn-export:hover{background:var(--azul-700)}\n  .btn-export:focus-visible{outline:3px solid var(--cian-500);outline-offset:2px}\n  .btn-export svg{vertical-align:-3px;margin-right:.4rem}\n  /* ============ Encabezado exclusivo de impresión ============ */\n  #printHead{display:none}\n  footer{\n    text-align:center;font-size:.89rem;color:var(--tinta-500);padding:1.2rem 1rem 2rem;\n    max-width:940px;margin:0 auto;\n  }\n  footer .firma{font-family:var(--mono);color:var(--azul-700);margin-bottom:.3rem}\n  /* ============ Responsive ============ */\n  @media(min-width:760px){\n    .fila-doble{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}\n  }\n  @media(max-width:480px){\n    .tarjeta{padding:.9rem}\n    table.desglose td.pct,table.desglose thead th:last-child{display:none}\n    html{font-size:16px} /* límite inferior de marca */\n  }\n  /* ============ Impresión / Guardar como PDF: solo el resultado ============ */\n  @media print{\n    body{background:#fff;color:#000}\n    header,.tarjeta:not(#resultados),footer,.zona-export,.estado-vacio,.error-monto{display:none !important}\n    /* Sin cálculo no hay cédula: evita imprimir membrete con tabla vacía desde Ctrl+P */\n    body.sin-calculo #resultados{display:none !important}\n    body.sin-calculo main::after{content:\"No hay cálculo que imprimir. Capture el monto en la calculadora y use el botón “Guardar como PDF”.\";display:block;font-size:1rem;color:#000;padding:1rem 0}\n    #printHead{display:block;border-bottom:3px solid var(--azul-800);margin-bottom:1rem;padding-bottom:.6rem}\n    #printHead .despacho{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--azul-800)}\n    #printHead h2{font-family:var(--serif);color:var(--azul-800);font-size:1.3rem;margin:.2rem 0}\n    #printHead .meta{font-size:.85rem;color:#333}\n    #resultados{display:block !important;box-shadow:none;border:none;margin:0;padding:0}\n    .factor-caja,.fundamento-caja,.advertencia{border:1px solid #bbb;background:#fff;color:#000}\n    /* Tabla y chips en papel: bordes en lugar de fondos */\n    .tabla-marco{box-shadow:none;border:1px solid #999}\n    table.desglose thead th{background:#fff !important;color:#000;border-bottom:2px solid #000}\n    table.desglose tbody tr:nth-child(even):not(.total) td{background:#fff}\n    tr.total td{background:#fff !important;color:#000;border-top:2.5px solid #000}\n    tr.total td.monto,tr.total td.pct{color:#000}\n    .signo{border:1px solid #666 !important;background:#fff !important;color:#000 !important}\n    .chip{background:#fff;border:1px solid #999;color:#000}\n    .chip span{color:#444}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header>\n  <div class=\"despacho\">DSouza Consultores Fiscales<\u002Fdiv>\n  <h1>Calculadora de IVA y Retenciones · Ejercicio 2026<\u002Fh1>\n  <p>Régimen fiscal (catálogo SAT) + Tipo de operación · Desde el gasto o desde el monto pagado<\u002Fp>\n<\u002Fheader>\n\n<main>\n\n  <!-- PASO 1: Modo de cálculo -->\n  <section class=\"tarjeta\">\n    <span class=\"paso\" id=\"lblPaso1\">PASO 1 · MODO DE CÁLCULO<\u002Fspan>\n    <div class=\"segmentos\" id=\"segModo\" role=\"group\" aria-labelledby=\"lblPaso1\">\n      <button data-modo=\"gasto\" class=\"activo\" aria-pressed=\"true\">Desde el GASTO<small>Capturo el subtotal y obtengo el neto a pagar<\u002Fsmall><\u002Fbutton>\n      <button data-modo=\"pago\" aria-pressed=\"false\">Desde el PAGO<small>Capturo lo pagado y obtengo gasto, IVA y retenciones<\u002Fsmall><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"fila-doble\">\n    <!-- PASO 2: Tasa de IVA -->\n    <section class=\"tarjeta\">\n      <span class=\"paso\" id=\"lblPaso2\">PASO 2 · TASA DE IVA<\u002Fspan>\n      <div class=\"segmentos\" id=\"segTasa\" role=\"group\" aria-labelledby=\"lblPaso2\">\n        <button data-tasa=\"0.16\" class=\"activo\" aria-pressed=\"true\">16%<small>Tasa general<\u002Fsmall><\u002Fbutton>\n        <button data-tasa=\"0.08\" aria-pressed=\"false\">8%<small>Región Fronteriza (crédito 50%)<\u002Fsmall><\u002Fbutton>\n        <button data-tasa=\"0\" aria-pressed=\"false\">0% / Exento<small>Sin IVA trasladado<\u002Fsmall><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- PASO 3: Régimen fiscal del emisor -->\n    <section class=\"tarjeta\">\n      <span class=\"paso\">PASO 3 · RÉGIMEN FISCAL DEL EMISOR (quien factura)<\u002Fspan>\n      <label class=\"etiqueta\" for=\"selRegimen\">Catálogo SAT c_RegimenFiscal<\u002Flabel>\n      <select id=\"selRegimen\"><\u002Fselect>\n      <div id=\"zonaEmisorTipo\" class=\"oculto\" style=\"margin-top:.7rem\">\n        <span class=\"etiqueta\" id=\"lblEmisorTipo\">Este régimen admite PF y PM. ¿El emisor es…?<\u002Fspan>\n        <div class=\"segmentos\" id=\"segEmisor\" role=\"group\" aria-labelledby=\"lblEmisorTipo\">\n          <button data-emisor=\"PF\" class=\"activo\" aria-pressed=\"true\">Persona Física<\u002Fbutton>\n          <button data-emisor=\"PM\" aria-pressed=\"false\">Persona Moral<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div class=\"fila-doble\">\n    <!-- PASO 4: Tipo de operación -->\n    <section class=\"tarjeta\">\n      <span class=\"paso\">PASO 4 · TIPO DE OPERACIÓN<\u002Fspan>\n      <label class=\"etiqueta\" for=\"selOperacion\">¿Qué se está facturando?<\u002Flabel>\n      <select id=\"selOperacion\"><\u002Fselect>\n      <div class=\"nota\" id=\"notaOperacion\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- PASO 5: Pagador -->\n    <section class=\"tarjeta\">\n      <span class=\"paso\" id=\"lblPaso5\">PASO 5 · PAGADOR (receptor del CFDI)<\u002Fspan>\n      <div class=\"segmentos\" id=\"segPagador\" role=\"group\" aria-labelledby=\"lblPaso5\">\n        <button data-pagador=\"PM\" class=\"activo\" aria-pressed=\"true\">Persona Moral<small>Obligada a retener (Art. 1o.-A f.II LIVA)<\u002Fsmall><\u002Fbutton>\n        <button data-pagador=\"PF\" aria-pressed=\"false\">Persona Física<small>En general no retiene<\u002Fsmall><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <!-- PASO 6: Monto -->\n  <section class=\"tarjeta\">\n    <span class=\"paso\">PASO 6 · MONTO<\u002Fspan>\n    <label class=\"etiqueta\" id=\"lblMonto\" for=\"inpMonto\">Escriba el GASTO (subtotal, sin IVA)<\u002Flabel>\n    <div class=\"campo-monto\">\n      <span class=\"simbolo\">$<\u002Fspan>\n      <input type=\"text\" id=\"inpMonto\" inputmode=\"decimal\" placeholder=\"0.00\" autocomplete=\"off\" aria-describedby=\"errMonto\">\n    <\u002Fdiv>\n    <div class=\"error-monto oculto\" id=\"errMonto\" role=\"alert\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Estado vacío: aún no hay monto -->\n  <div class=\"estado-vacio\" id=\"estadoVacio\">Capture el monto en el Paso 6 para ver el desglose de IVA, retenciones y neto a pagar.<\u002Fdiv>\n\n  <!-- Anuncio acotado para lectores de pantalla -->\n  <div class=\"sr-live\" aria-live=\"polite\" id=\"anuncioSR\"><\u002Fdiv>\n\n  <!-- Aviso fuera de alcance -->\n  <section class=\"tarjeta oculto\" id=\"cajaFuera\">\n    <div class=\"fuera-alcance\" id=\"txtFuera\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RESULTADOS -->\n  <section class=\"tarjeta oculto\" id=\"resultados\">\n    <!-- Encabezado que solo aparece al imprimir / guardar como PDF -->\n    <div id=\"printHead\">\n      <div class=\"despacho\">DSouza Consultores Fiscales · C.P. Daniel Souza Vázquez<\u002Fdiv>\n      <h2>Cédula de IVA y Retenciones · Ejercicio 2026<\u002Fh2>\n      <div class=\"meta\" id=\"printMeta\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 id=\"tituloResultado\"><\u002Fh2>\n    <div class=\"chips\" id=\"resumenChips\"><\u002Fdiv>\n    <div class=\"tabla-marco\">\n      <table class=\"desglose\">\n        <thead>\n          <tr><th>Concepto<\u002Fth><th style=\"text-align:right\">Importe<\u002Fth><th style=\"text-align:right\">% s/ gasto<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody id=\"cuerpoTabla\"><\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div class=\"factor-caja\" id=\"cajaFactor\"><\u002Fdiv>\n    <div class=\"fundamento-caja\" id=\"cajaFundamento\"><\u002Fdiv>\n    <div class=\"advertencia oculto\" id=\"cajaAdvertencia\"><\u002Fdiv>\n\n    <div class=\"zona-export\">\n      <button class=\"btn-export\" id=\"btnExcel\" type=\"button\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2\"><\u002Fpath><\u002Fsvg>\n        Exportar a Excel (CSV)\n      <\u002Fbutton>\n      <button class=\"btn-export\" id=\"btnPdf\" type=\"button\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-12-3h12v6H6v-6z\"><\u002Fpath><\u002Fsvg>\n        Guardar como PDF\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<noscript>\n  <div style=\"max-width:1100px;margin:1rem auto;padding:1rem;background:#FCEAE8;color:#A81D14;border:1px solid #F0BDB8;border-radius:14px;font-family:Georgia,serif\">\n    Esta calculadora requiere JavaScript. Active JavaScript en su navegador para utilizarla.\n  <\u002Fdiv>\n<\u002Fnoscript>\n\n<footer>\n  <div class=\"firma\">DSouza Consultores Fiscales · C.P. Daniel Souza Vázquez · Mexicali, B.C.<\u002Fdiv>\n  Fuentes: LISR Arts. 106 y 116 últ. párr. (10%), Art. 113-J (1.25% RESICO PF) · LIVA Art. 1o.-A fraccs. II y III ·\n  RLIVA Art. 3 fraccs. I (⅔, solo cuando el IVA lo traslada una persona física) y II (4% autotransporte) ·\n  RMF 2026 reglas 11.9.2 y 11.9.3 (estímulo frontera).<br>\n  La retención la dispara el TIPO DE OPERACIÓN + pagador persona moral; el régimen del emisor solo cambia la tasa de ISR.\n  Cálculos con fracciones exactas (⅔ del IVA), no factores redondeados.\n  Herramienta de apoyo interno: no sustituye el análisis del caso concreto.\n<\u002Ffooter>\n\n<script>\n\"use strict\";\n/* =====================================================================\n   MOTOR DE CÁLCULO 2026 — DSouza Consultores Fiscales\n   Basado en: Estudio_Retenciones_ISR_IVA_PF_a_PM_2026.md y\n   Cuadro_Consolidado_Retenciones_ISR_IVA_2026.xlsx.\n   Regla de oro: la retención depende del TIPO DE OPERACIÓN + pagador PM.\n   El régimen del emisor solo cambia la tasa de ISR (10% vs 1.25%).\n   IMPORTANTE (Art. 3 f.I RLIVA): la retención de ⅔ solo procede cuando el\n   IVA lo traslada una PERSONA FÍSICA. El 4% de autotransporte aplica con\n   emisor PF o PM. Desperdicios (Art. 1o.-A f.II b LIVA): retención del\n   TOTAL del IVA trasladado, emisor PF o PM — el inciso b) no distingue y\n   el Art. 3 RLIVA no prevé reducción; con estímulo frontera se retiene el\n   total del 8% efectivo (regla 11.9.3 f.IV RMF 2026).\n   ===================================================================== */\n\n/* ---------- Catálogo SAT c_RegimenFiscal (completo) ---------- */\nconst REGIMENES = [\n  { c:\"601\", d:\"General de Ley Personas Morales\",                        fisica:false, moral:true,  ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"603\", d:\"Personas Morales con Fines no Lucrativos\",               fisica:false, moral:true,  ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"605\", d:\"Sueldos y Salarios e Ingresos Asimilados a Salarios\",    fisica:true,  moral:false, ops:null },\n  { c:\"606\", d:\"Arrendamiento\",                                          fisica:true,  moral:false, ops:[\"arrendGravado\",\"arrendExento\"] },\n  { c:\"607\", d:\"Régimen de Enajenación o Adquisición de Bienes\",         fisica:true,  moral:false, ops:null },\n  { c:\"608\", d:\"Demás ingresos\",                                         fisica:true,  moral:false, ops:null },\n  { c:\"610\", d:\"Residentes en el Extranjero sin Establecimiento Permanente en México\", fisica:true, moral:true, ops:[\"extranjero\"] },\n  { c:\"611\", d:\"Ingresos por Dividendos (socios y accionistas)\",         fisica:true,  moral:false, ops:null },\n  { c:\"612\", d:\"Personas Físicas con Actividades Empresariales y Profesionales\", fisica:true, moral:false, ops:[\"servProf\",\"comision\",\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"614\", d:\"Ingresos por intereses\",                                 fisica:true,  moral:false, ops:null },\n  { c:\"615\", d:\"Régimen de los ingresos por obtención de premios\",       fisica:true,  moral:false, ops:null },\n  { c:\"616\", d:\"Sin obligaciones fiscales\",                              fisica:true,  moral:false, ops:null },\n  { c:\"620\", d:\"Sociedades Cooperativas de Producción que optan por diferir sus ingresos\", fisica:false, moral:true, ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"621\", d:\"Incorporación Fiscal\",                                   fisica:true,  moral:false, ops:null },\n  { c:\"622\", d:\"Actividades Agrícolas, Ganaderas, Silvícolas y Pesqueras\", fisica:false, moral:true, ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"623\", d:\"Opcional para Grupos de Sociedades\",                     fisica:false, moral:true,  ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"624\", d:\"Coordinados\",                                            fisica:false, moral:true,  ops:[\"actEmp\",\"autotransporte\",\"desperdicios\"] },\n  { c:\"625\", d:\"Actividades Empresariales con ingresos a través de Plataformas Tecnológicas\", fisica:true, moral:false, ops:null },\n  { c:\"626\", d:\"Régimen Simplificado de Confianza (RESICO)\",             fisica:true,  moral:true,  ops:[\"servProf\",\"arrendGravado\",\"arrendExento\",\"comision\",\"actEmp\",\"autotransporte\",\"desperdicios\"] }\n];\n\n/* ---------- Catálogo de operaciones ---------- */\nconst OPERACIONES = {\n  servProf:      { nombre:\"Servicios profesionales (honorarios) a PM\",\n                   nota:\"Servicios personales independientes. Con emisor PF y pagador PM: retención de ⅔ del IVA y de ISR según régimen (10% Art. 106 · 1.25% RESICO Art. 113-J).\" },\n  arrendGravado: { nombre:\"Arrendamiento / uso o goce gravado (p. ej. local comercial)\",\n                   nota:\"Uso o goce temporal de bienes gravado. Con emisor PF y pagador PM: retención de ⅔ del IVA y de ISR según régimen (10% Art. 116 · 1.25% RESICO).\" },\n  arrendExento:  { nombre:\"Arrendamiento exento (casa habitación)\",\n                   nota:\"Renta exenta de IVA: la tasa del Paso 2 no aplica. Con emisor PF y pagador PM: solo retención de ISR (10% Art. 116 · 1.25% RESICO).\" },\n  comision:      { nombre:\"Comisión mercantil\",\n                   nota:\"La comisión es actividad empresarial (Art. 100 f.I LISR): NO genera ISR 10%; solo 1.25% si el comisionista es RESICO. Con emisor PF y pagador PM retiene ⅔ del IVA (Art. 1o.-A f.II d).\" },\n  actEmp:        { nombre:\"Actividad empresarial / venta de bienes / gasto general\",\n                   nota:\"Enajenación de bienes o comercio: NO encuadra en el Art. 1o.-A f.II LIVA, sin retención de IVA. ISR: solo 1.25% si el emisor es RESICO PF.\" },\n  autotransporte:{ nombre:\"Autotransporte terrestre de bienes\",\n                   nota:\"Retención de 4% sobre el VALOR de la contraprestación efectivamente pagada (Art. 3 f.II RLIVA); aplica con emisor PF o PM. ISR: solo 1.25% si el emisor es RESICO PF.\" },\n  desperdicios:  { nombre:\"Enajenación de desperdicios (insumo industrial)\",\n                   nota:\"El pagador PM retiene el TOTAL del IVA trasladado, con emisor PF o PM (Art. 1o.-A f.II b LIVA; sin reducción en el Art. 3 RLIVA). Al 16% equivale a retener 16% del valor; con estímulo frontera se retiene el total del 8% efectivo (regla 11.9.3 f.IV RMF 2026). ISR: solo 1.25% si el emisor es RESICO PF.\" },\n  extranjero:    { nombre:\"Enajenación / uso o goce por residente en el extranjero sin EP\",\n                   nota:\"El adquirente (PF o PM) retiene el TOTAL del IVA (Art. 1o.-A f.III LIVA). El ISR se rige por el Título V LISR (no residentes) y queda fuera de esta herramienta. Sin estímulo fronterizo.\" }\n};\n\n/* ---------- Tasa y fundamento de ISR por régimen × operación ---------- */\nfunction tasaISR(reg, emisor, op){\n  if (emisor !== \"PF\") return { tasa:0, fund:null }; // solo se retiene ISR a personas físicas\n  if (reg.c === \"626\") return { tasa:0.0125, fund:\"ISR 1.25% — Art. 113-J LISR (RESICO PF, base sin considerar IVA)\" };\n  if (reg.c === \"612\"){\n    if (op === \"servProf\") return { tasa:0.10, fund:\"ISR 10% — Art. 106, último párrafo, LISR\" };\n    return { tasa:0, fund:\"Sin retención de ISR — la operación es actividad empresarial (Art. 100 f.I LISR); el Art. 106 solo grava servicios profesionales\" };\n  }\n  if (reg.c === \"606\") return { tasa:0.10, fund:\"ISR 10% — Art. 116, último párrafo, LISR\" };\n  if (reg.c === \"610\") return { tasa:0, fund:\"ISR de no residentes conforme al Título V LISR — fuera del alcance de esta herramienta\" };\n  return { tasa:0, fund:null };\n}\n\n/* ---------- Regla de retención de IVA por operación × emisor ----------\n   Art. 3 f.I RLIVA: la retención de ⅔ SOLO procede cuando el IVA lo\n   traslada una persona física. El 4% (f.II) aplica con emisor PF o PM.\n   Desperdicios: el cuadro del despacho lo acota a emisor PF.\n   Extranjero (Art. 1o.-A f.III): retiene el adquirente, PF o PM. */\nfunction reglaIVA(op, emisor){\n  const esPF = emisor === \"PF\";\n  switch(op){\n    case \"servProf\":\n    case \"arrendGravado\":\n    case \"comision\":\n      return esPF\n        ? { regla:\"DOS_TERCIOS\", fund:\"Retención de ⅔ del IVA — Art. 1o.-A f.II LIVA + Art. 3 f.I RLIVA\" }\n        : { regla:null, fund:\"Sin retención de IVA — la retención de ⅔ solo procede cuando el IVA lo traslada una persona física (Art. 3 f.I RLIVA)\" };\n    case \"autotransporte\":\n      return { regla:\"CUATRO_PCT\", fund:\"Retención de 4% sobre el valor de la contraprestación — Art. 1o.-A f.II c) LIVA + Art. 3 f.II RLIVA (emisor PF o PM)\" };\n    case \"desperdicios\":\n      /* Art. 1o.-A f.II b) LIVA: la obligación recae en la PM ADQUIRENTE, sin\n         limitar quién enajena (a diferencia del inciso a, que exige PF).\n         El Art. 3 RLIVA no incluye desperdicios entre las reducciones (⅔ y 4%),\n         por lo que aplica la regla general: retención del TOTAL del IVA. */\n      return { regla:\"TOTAL\", fund:\"Retención del TOTAL del IVA trasladado (equivale al 16% sobre el valor) — Art. 1o.-A f.II b) LIVA; sin reducción: el Art. 3 RLIVA solo prevé ⅔ (servicios personales, comisión, uso o goce) y 4% (autotransporte), y los desperdicios no están comprendidos\" };\n    case \"extranjero\":\n      return { regla:\"TOTAL\", fund:\"Retención del total del IVA — Art. 1o.-A f.III LIVA\" };\n    default:\n      return { regla:null, fund:\"Sin retención de IVA — la operación no encuadra en el Art. 1o.-A f.II LIVA\" };\n  }\n}\n\n/**\n * Cálculo principal a partir del GASTO (subtotal).\n * @param {number} gasto  subtotal sin IVA\n * @param {number} tasa   0.16 | 0.08 | 0\n * @param {object} ctx    {reg, emisor, op, pagador}\n */\nfunction calcularDesdeGasto(gasto, tasa, ctx){\n  const { reg, emisor, op, pagador } = ctx;\n  const avisos = [];\n\n  // --- IVA trasladado ---\n  let t = tasa;\n  if (op === \"arrendExento\") t = 0;                       // exento: la tasa elegida no aplica\n  if (op === \"extranjero\"){\n    t = 0.16;                                             // el estímulo fronterizo no aplica a este supuesto\n    if (tasa !== 0.16) avisos.push(\"Residente extranjero: no aplica el estímulo fronterizo ni la tasa 0%; el cálculo se hace al 16% (Art. 1o.-A f.III LIVA).\");\n  }\n  const iva = gasto * t;\n\n  // --- ¿Procede retención? (regla de oro: pagador PM; excepción: extranjero retiene PF o PM) ---\n  const retieneIva = (pagador === \"PM\") || (op === \"extranjero\");\n  const retieneIsr = (pagador === \"PM\");\n\n  // --- Retención de IVA (la regla ya considera el tipo de emisor) ---\n  const rIVA = reglaIVA(op, emisor);\n  let retIva = 0, descIva = \"\";\n  if (retieneIva && t > 0){\n    if (rIVA.regla === \"DOS_TERCIOS\"){ retIva = iva * 2 / 3; descIva = \"⅔ del IVA\"; }   // fracción exacta\n    if (rIVA.regla === \"CUATRO_PCT\"){  retIva = gasto * 0.04; descIva = \"4% s/valor\"; }\n    if (rIVA.regla === \"TOTAL\"){       retIva = iva;          descIva = \"total del IVA\"; }\n  }\n  if (t === 0 && rIVA.regla && retieneIva){\n    avisos.push(\"Con tasa 0% / exento no hay IVA trasladado, por lo que no procede retención de IVA.\");\n  }\n\n  // --- Retención de ISR ---\n  const rISR = tasaISR(reg, emisor, op);\n  const retIsr = retieneIsr ? gasto * rISR.tasa : 0;\n\n  // --- Avisos específicos ---\n  if (pagador === \"PF\" && op !== \"extranjero\"){\n    avisos.push(\"Pagador persona física: no hay retención de ISR ni de IVA en estos supuestos (solo las personas morales retienen, Art. 1o.-A f.II LIVA y Arts. 106/116/113-J LISR).\");\n  }\n  if (emisor === \"PM\" && [\"servProf\",\"arrendGravado\",\"comision\"].includes(op)){\n    avisos.push(\"Emisor persona moral: no procede la retención de ⅔ del IVA; esa retención exige que el IVA lo traslade una persona física (Art. 3 f.I RLIVA).\");\n  }\n  if (op === \"desperdicios\" && retIva > 0){\n    avisos.push(\"Desperdicios: la retención recae en la PM adquirente sin importar si el enajenante es PF o PM (Art. 1o.-A f.II b LIVA no distingue, a diferencia del inciso a).\");\n  }\n  if (rIVA.regla === \"DOS_TERCIOS\" && retIva > 0){\n    avisos.push(\"La retención de ⅔ del IVA es fracción periódica infinita: en su sistema capture IVA × 2 ÷ 3, no 0.1067 ni 0.0533.\");\n  }\n  if (tasa === 0.08 && t === 0.08){\n    avisos.push(\"Estímulo frontera: es un crédito del 50% (no una tasa). Requiere aviso vigente (regla 11.9.2 RMF 2026) y CFDI con TasaOCuota 'IVA Crédito aplicado del 50%'. La retención se calcula sobre el IVA ya reducido (regla 11.9.3 f.IV).\");\n  }\n  if (tasa === 0.08 && op === \"desperdicios\" && retIva > 0){\n    avisos.push(\"Desperdicios con estímulo fronterizo: la retención sigue siendo TOTAL, pero calculada sobre el IVA ya acreditado al 50% (8% efectivo) — regla 11.9.3, fracc. IV, RMF 2026: se captura 'la tasa que corresponda una vez aplicado el crédito del 50%'.\");\n  }\n  if (op === \"autotransporte\" && tasa === 0.08 && retIva > 0){\n    avisos.push(\"Autotransporte: el 4% se calcula sobre el VALOR de la contraprestación (Art. 3 f.II RLIVA), no como fracción del IVA, por lo que no se reduce por el estímulo fronterizo.\");\n  }\n  if (op === \"arrendExento\"){\n    avisos.push(\"Operación exenta de IVA: la tasa seleccionada en el Paso 2 no interviene en este cálculo.\");\n  }\n  if (reg.c === \"610\"){\n    avisos.push(\"El ISR del residente extranjero se determina conforme al Título V LISR y NO está incluido en este cálculo.\");\n  }\n\n  const neto = gasto + iva - retIva - retIsr;\n  const factor = neto / (gasto || 1);\n  return { gasto, iva, tasaEfectiva:t, retIva, descIva, retIsr, tasaIsr:(retieneIsr?rISR.tasa:0), neto, factor,\n           fundIva:rIVA.fund, fundIsr:rISR.fund, avisos };\n}\n\n/** Cálculo inverso: del MONTO PAGADO reconstruye el gasto con el mismo factor exacto. */\nfunction calcularDesdePago(pago, tasa, ctx){\n  const unit = calcularDesdeGasto(1, tasa, ctx);\n  const gasto = pago / unit.factor;\n  return calcularDesdeGasto(gasto, tasa, ctx);\n}\n\n/* =====================================================================\n   INTERFAZ\n   ===================================================================== */\nlet modo = \"gasto\", tasa = 0.16, emisor = \"PF\", pagador = \"PM\";\nlet ultimoCalculo = null;   // para exportaciones\n\nconst $ = id => document.getElementById(id);\nconst marcarSinCalculo = () => document.body.classList.toggle(\"sin-calculo\", !ultimoCalculo);\nconst fmt = n => n.toLocaleString(\"es-MX\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fmtPct = n => (n*100).toLocaleString(\"es-MX\",{minimumFractionDigits:2,maximumFractionDigits:4})+\" %\";\n\n/* --- Poblar régimen --- */\nconst selReg = $(\"selRegimen\");\nREGIMENES.forEach(r=>{\n  const o=document.createElement(\"option\");\n  o.value=r.c; o.textContent=`${r.c} · ${r.d}`;\n  selReg.appendChild(o);\n});\nselReg.value = \"612\";\n\nfunction regimenActual(){ return REGIMENES.find(r=>r.c===selReg.value); }\n\n/* --- Emisor PF/PM (solo visible si el régimen admite ambos) --- */\nfunction sincronizarEmisor(){\n  const r = regimenActual();\n  const ambos = r.fisica && r.moral;\n  $(\"zonaEmisorTipo\").classList.toggle(\"oculto\", !ambos);\n  if (!ambos) emisor = r.fisica ? \"PF\" : \"PM\";\n}\n\n/* --- Poblar operaciones según régimen --- */\nconst selOp = $(\"selOperacion\");\nfunction poblarOperaciones(){\n  const r = regimenActual();\n  selOp.innerHTML = \"\";\n  if (!r.ops){ $(\"notaOperacion\").textContent = \"\"; return; }\n  r.ops.forEach(id=>{\n    const o=document.createElement(\"option\");\n    o.value=id; o.textContent=OPERACIONES[id].nombre;\n    selOp.appendChild(o);\n  });\n  $(\"notaOperacion\").textContent = OPERACIONES[selOp.value].nota;\n}\n\nfunction leerMonto(){\n  const bruto = $(\"inpMonto\").value.trim();\n  if (bruto === \"\") return { valor:null, error:false };\n  const crudo = bruto.replace(/,/g,\"\").replace(/\\$/g,\"\").replace(/\\s/g,\"\");\n  // Número válido completo o en curso: tolera \"15.\" (tecleo de decimal), rechaza \"1.2.3\"\n  if (!/^\\d+\\.?\\d*$|^\\.\\d+$/.test(crudo)) return { valor:null, error:true };\n  const n = parseFloat(crudo);\n  return isNaN(n)||n<0 ? { valor:null, error:true } : { valor:n, error:false };\n}\n\nfunction marcarMonto(error){\n  const inp = $(\"inpMonto\"), err = $(\"errMonto\");\n  inp.classList.toggle(\"invalido\", error);\n  err.classList.toggle(\"oculto\", !error);\n  err.textContent = error ? \"Monto no válido: capture solo números, p. ej. 15,000.00\" : \"\";\n}\n\nlet timerSR = null;\nfunction anunciarSR(texto){\n  clearTimeout(timerSR);\n  timerSR = setTimeout(()=>{ $(\"anuncioSR\").textContent = texto; }, 600);\n}\n\nfunction descripcionSeleccion(){\n  const r = regimenActual();\n  return {\n    modo: modo===\"gasto\" ? \"Desde el gasto\" : \"Desde el monto pagado\",\n    tasa: tasa===0.16?\"16% general\":(tasa===0.08?\"8% Región Fronteriza\":\"0% / Exento\"),\n    regimen: `${r.c} · ${r.d}` + ((r.fisica&&r.moral)?` (emisor ${emisor})`:\"\"),\n    operacion: OPERACIONES[selOp.value] ? OPERACIONES[selOp.value].nombre : \"\",\n    pagador: pagador===\"PM\"?\"Persona Moral\":\"Persona Física\"\n  };\n}\n\n/* Tarjetas de los pasos 4-6 (se ocultan cuando el régimen está fuera de alcance) */\nfunction tarjetasPasos456(){\n  return [selOp.closest(\".tarjeta\"), $(\"segPagador\").closest(\".tarjeta\"), $(\"inpMonto\").closest(\".tarjeta\")];\n}\n\nfunction render(){\n  try{ renderInterno(); } finally { marcarSinCalculo(); }\n}\n\nfunction renderInterno(){\n  sincronizarEmisor();\n  const r = regimenActual();\n  const fuera = $(\"cajaFuera\"), res = $(\"resultados\"), vacio = $(\"estadoVacio\");\n\n  $(\"lblMonto\").textContent = modo===\"gasto\"\n    ? \"Escriba el GASTO (subtotal, sin IVA)\"\n    : \"Escriba el MONTO PAGADO (neto que salió del banco)\";\n\n  if (!r.ops){\n    fuera.classList.remove(\"oculto\"); res.classList.add(\"oculto\"); vacio.classList.add(\"oculto\");\n    tarjetasPasos456().forEach(t=>t.classList.add(\"oculto\"));\n    ultimoCalculo=null;\n    $(\"txtFuera\").innerHTML = `<strong>Régimen ${r.c} — ${r.d}:<\u002Fstrong> fuera del alcance de esta herramienta.\n      Los supuestos de retención analizados (Arts. 106/116/113-J LISR y 1o.-A LIVA) no aplican de forma directa\n      o requieren un esquema propio (p. ej. plataformas tecnológicas, sueldos, dividendos, intereses o premios).\n      Consulte al área fiscal antes de facturar.`;\n    anunciarSR(`Régimen ${r.c} fuera del alcance de esta herramienta.`);\n    return;\n  }\n  fuera.classList.add(\"oculto\");\n  tarjetasPasos456().forEach(t=>t.classList.remove(\"oculto\"));\n\n  const op = selOp.value;\n  if (!op){ res.classList.add(\"oculto\"); vacio.classList.remove(\"oculto\"); ultimoCalculo=null; return; }\n  $(\"notaOperacion\").textContent = OPERACIONES[op].nota;\n\n  const m = leerMonto();\n  marcarMonto(m.error);\n  const monto = m.valor;\n  if (monto===null || monto===0){ res.classList.add(\"oculto\"); vacio.classList.remove(\"oculto\"); ultimoCalculo=null; return; }\n  vacio.classList.add(\"oculto\");\n\n  const ctx = { reg:r, emisor, op, pagador };\n  const c = modo===\"gasto\" ? calcularDesdeGasto(monto,tasa,ctx) : calcularDesdePago(monto,tasa,ctx);\n  ultimoCalculo = c;\n\n  $(\"tituloResultado\").textContent = modo===\"gasto\"\n    ? \"Desglose: del gasto al neto a pagar\"\n    : \"Desglose: del monto pagado al gasto (cálculo inverso)\";\n\n  // Chips con el contexto de la selección (también salen al imprimir)\n  const s0 = descripcionSeleccion();\n  $(\"resumenChips\").innerHTML = [\n    [\"Modo\", s0.modo], [\"Tasa de IVA\", s0.tasa], [\"Régimen emisor\", s0.regimen],\n    [\"Operación\", s0.operacion], [\"Pagador\", s0.pagador]\n  ].map(([k,v])=>`<div class=\"chip\"><span>${k}<\u002Fspan>${v}<\u002Fdiv>`).join(\"\");\n\n  const filas = [];\n  filas.push(`<tr><td><span class=\"signo base\">=<\u002Fspan>Gasto (subtotal)<\u002Ftd><td class=\"monto\">$ ${fmt(c.gasto)}<\u002Ftd><td class=\"pct\">100.00 %<\u002Ftd><\u002Ftr>`);\n  if (c.tasaEfectiva>0){\n    filas.push(`<tr class=\"suma\"><td><span class=\"signo mas\">+<\u002Fspan>IVA trasladado (${(c.tasaEfectiva*100).toFixed(0)}%)<\u002Ftd><td class=\"monto\">$ ${fmt(c.iva)}<\u002Ftd><td class=\"pct\">${fmtPct(c.iva/c.gasto)}<\u002Ftd><\u002Ftr>`);\n  } else {\n    filas.push(`<tr><td><span class=\"signo base\">·<\u002Fspan>IVA<\u002Ftd><td class=\"monto\">No aplica<\u002Ftd><td class=\"pct\">—<\u002Ftd><\u002Ftr>`);\n  }\n  if (c.retIva>0){\n    filas.push(`<tr class=\"resta\"><td><span class=\"signo menos\">−<\u002Fspan>Retención de IVA (${c.descIva})<\u002Ftd><td class=\"monto\">$ ${fmt(c.retIva)}<\u002Ftd><td class=\"pct\">${fmtPct(c.retIva/c.gasto)}<\u002Ftd><\u002Ftr>`);\n  }\n  if (c.retIsr>0){\n    filas.push(`<tr class=\"resta\"><td><span class=\"signo menos\">−<\u002Fspan>Retención de ISR (${(c.tasaIsr*100).toLocaleString(\"es-MX\")}%)<\u002Ftd><td class=\"monto\">$ ${fmt(c.retIsr)}<\u002Ftd><td class=\"pct\">${fmtPct(c.tasaIsr)}<\u002Ftd><\u002Ftr>`);\n  }\n  filas.push(`<tr class=\"total\"><td>Neto a pagar<\u002Ftd><td class=\"monto\">$ ${fmt(c.neto)}<\u002Ftd><td class=\"pct\"><\u002Ftd><\u002Ftr>`);\n  $(\"cuerpoTabla\").innerHTML = filas.join(\"\");\n\n  $(\"cajaFactor\").innerHTML = modo===\"gasto\"\n    ? `<strong>Factor gasto → neto:<\u002Fstrong> <code>${c.factor.toFixed(10)}<\u002Fcode><br>Neto = gasto × factor · Gasto = neto ÷ factor.`\n    : `<strong>Factor aplicado (neto ÷ gasto):<\u002Fstrong> <code>${c.factor.toFixed(10)}<\u002Fcode><br>Gasto = monto pagado ÷ factor. Verificación: $ ${fmt(c.gasto)} × ${c.factor.toFixed(10)} = $ ${fmt(c.gasto*c.factor)}.`;\n\n  const funds = [];\n  if (c.fundIsr) funds.push(\"• \" + c.fundIsr);\n  funds.push(\"• \" + c.fundIva);\n  if (c.retIva > 0) funds.push(\"• Momento y entero: la retención se efectúa al pagar, sobre lo efectivamente pagado, y se entera a más tardar el día 17 del mes siguiente, sin acreditamiento, compensación o disminución contra el entero (Art. 1o.-A, antepenúltimo párrafo, LIVA)\");\n  if (tasa===0.08 && c.tasaEfectiva===0.08) funds.push(\"• Estímulo frontera: reglas 11.9.2 y 11.9.3 (fracc. IV) RMF 2026 — Decretos RFN (DOF 31-12-2018) y RFS (DOF 30-12-2020)\");\n  $(\"cajaFundamento\").innerHTML = \"<strong>Fundamentos:<\u002Fstrong><br>\" + funds.join(\"<br>\");\n\n  const adv = $(\"cajaAdvertencia\");\n  if (c.avisos.length){ adv.innerHTML = \"<strong>Atención:<\u002Fstrong><br>\" + c.avisos.join(\"<br>\"); adv.classList.remove(\"oculto\"); }\n  else adv.classList.add(\"oculto\");\n\n  // Meta para impresión\n  const s = descripcionSeleccion();\n  $(\"printMeta\").textContent =\n    `${s.modo} · Tasa: ${s.tasa} · Régimen: ${s.regimen} · Operación: ${s.operacion} · Pagador: ${s.pagador} · Fecha: ${new Date().toLocaleDateString(\"es-MX\")}`;\n\n  res.classList.remove(\"oculto\");\n  anunciarSR(`Neto a pagar: ${fmt(c.neto)} pesos. Gasto ${fmt(c.gasto)}, IVA ${fmt(c.iva)}, retenciones ${fmt(c.retIva + c.retIsr)}.`);\n}\n\n/* =====================================================================\n   EXPORTACIONES (sin dependencias externas)\n   Excel → CSV con BOM UTF-8 (Excel lo abre directamente).\n   PDF   → hoja de estilos de impresión + diálogo nativo del navegador\n           (\"Guardar como PDF\" / \"Microsoft Print to PDF\").\n   ===================================================================== */\nfunction exportarCSV(){\n  if (!ultimoCalculo) return;\n  const c = ultimoCalculo, s = descripcionSeleccion();\n  const esc = v => '\"' + String(v).replace(/\"/g,'\"\"') + '\"';\n  const num = n => n.toFixed(2);\n  const filas = [\n    [\"DSouza Consultores Fiscales - Cedula de IVA y Retenciones 2026\"],\n    [\"Fecha\", new Date().toLocaleDateString(\"es-MX\")],\n    [\"Modo\", s.modo], [\"Tasa de IVA\", s.tasa], [\"Regimen del emisor\", s.regimen],\n    [\"Tipo de operacion\", s.operacion], [\"Pagador\", s.pagador],\n    [],\n    [\"Concepto\",\"Importe\",\"% sobre gasto\"],\n    [\"Gasto (subtotal)\", num(c.gasto), \"100.00%\"],\n    [\"IVA trasladado\", num(c.iva), c.gasto? (c.iva/c.gasto*100).toFixed(4)+\"%\" : \"0%\"],\n    [\"Retencion de IVA\" + (c.descIva? \" (\"+c.descIva+\")\":\"\"), num(-c.retIva), c.gasto? (c.retIva/c.gasto*100).toFixed(4)+\"%\" : \"0%\"],\n    [\"Retencion de ISR\", num(-c.retIsr), (c.tasaIsr*100).toFixed(4)+\"%\"],\n    [\"Neto a pagar\", num(c.neto), \"\"],\n    [],\n    [\"Factor (neto / gasto)\", c.factor.toFixed(10)],\n    [],\n    [\"Fundamentos\"],\n    ...(c.fundIsr? [[c.fundIsr]]:[]),\n    [c.fundIva],\n    ...(c.avisos.length? [[],[\"Avisos\"],...c.avisos.map(a=>[a])] : [])\n  ];\n  /* Separador ; y BOM explícito: Excel es-MX (coma decimal) abre el CSV en columnas correctas */\n  /* BOM UTF-8 + separador ; (predeterminado en configuración regional es-MX).\n     Sin línea \"sep=;\": haría que Excel ignore el BOM y rompa los acentos,\n     y Google Sheets / sistemas contables la leerían como fila de datos. */\n  const csv = \"\\uFEFF\" + filas.map(f=>f.map(esc).join(\";\")).join(\"\\r\\n\");\n  const blob = new Blob([csv], {type:\"text/csv;charset=utf-8;\"});\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(blob);\n  const hoy = new Date().toISOString().slice(0,10).replace(/-/g,\"\");\n  a.download = `cedula_retenciones_${hoy}.csv`;\n  document.body.appendChild(a); a.click();\n  URL.revokeObjectURL(a.href); a.remove();\n}\n\nfunction exportarPDF(){\n  if (!ultimoCalculo) return;\n  window.print();   // el CSS @media print imprime solo la cédula con membrete\n}\n\n/* ---------- Eventos ---------- */\nfunction segmento(idSeg, fn){\n  $(idSeg).addEventListener(\"click\", e=>{\n    const b=e.target.closest(\"button\"); if(!b) return;\n    document.querySelectorAll(\"#\"+idSeg+\" button\").forEach(x=>{\n      const act = x===b;\n      x.classList.toggle(\"activo\",act);\n      x.setAttribute(\"aria-pressed\", act?\"true\":\"false\");\n    });\n    fn(b); render();\n  });\n}\nsegmento(\"segModo\",   b=>{ modo=b.dataset.modo; });\nsegmento(\"segTasa\",   b=>{ tasa=parseFloat(b.dataset.tasa); });\nsegmento(\"segEmisor\", b=>{ emisor=b.dataset.emisor; });\nsegmento(\"segPagador\",b=>{ pagador=b.dataset.pagador; });\nselReg.addEventListener(\"change\", ()=>{ sincronizarEmisor(); poblarOperaciones(); render(); });\nselOp.addEventListener(\"change\", render);\n$(\"inpMonto\").addEventListener(\"input\", render);\n$(\"btnExcel\").addEventListener(\"click\", exportarCSV);\n$(\"btnPdf\").addEventListener(\"click\", exportarPDF);\n\n/* Estado inicial */\nsincronizarEmisor();\npoblarOperaciones();\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
